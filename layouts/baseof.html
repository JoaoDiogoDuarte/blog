<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  {{- with .Description | default .Summary }}
  <meta name="description" content="{{ . | plainify | truncate 160 }}">
  {{- end }}
  <link rel="stylesheet" href="{{ "katex/katex.min.css" | relURL }}">
  {{- with resources.Get "style.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
  {{- end }}
  {{- with .OutputFormats.Get "rss" }}
  <link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">
  {{- end }}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav><a href="{{ site.Params.homepage }}">About me</a></nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    © {{ now.Year }} {{ site.Params.author }} · <a href="{{ "index.xml" | relURL }}">RSS</a>
  </footer>
</body>
</html>
